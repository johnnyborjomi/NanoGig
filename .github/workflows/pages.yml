# Production site: https://johnnyborjomi.github.io/NanoGig/
# Deployed when a release tag vX.Y.Z is pushed, so installed apps only see an update on a
# release. Can also be run by hand, which redeploys the highest final release tag. The head of
# main goes to the separate staging site instead (staging.yml).
#
# Every release also stays reachable at its own path, https://johnnyborjomi.github.io/NanoGig/vX.Y.Z/,
# unpacked from the web zip the Release workflow attached to it (so it is byte-for-byte what
# shipped, no rebuild). Builds use relative paths and a per-folder service worker, so each
# copy runs on its own; only the root is the installed app.
name: Deploy to GitHub Pages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags are needed when run by hand

      - name: Pick the production tag
        id: prod
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            # Highest final release tag by semver (pre-releases such as v1.2.0-rc1 are skipped).
            TAG="$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
            [[ -n "$TAG" ]] || { echo "No release tag found"; exit 1; }
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Production = $TAG"

      - name: Check out the production tag
        run: git checkout -q "${{ steps.prod.outputs.tag }}"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Version from the tag
        run: |
          TAG="${{ steps.prod.outputs.tag }}"
          V="${TAG#v}"
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$ ]] || { echo "Tag '$TAG' is not vX.Y.Z"; exit 1; }
          # The build reads package.json, so a release cut from the GitHub UI still reports its tag.
          npm version "$V" --no-git-tag-version --allow-same-version
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          NANOGIG_CHANNEL: production
      - name: Add every release at its own path (dist/vX.Y.Z/ from the release zips)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p zips
          for TAG in $(gh api --paginate repos/${GITHUB_REPOSITORY}/releases -q '.[] | select(.draft | not) | .tag_name' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$'); do
            if gh release download "$TAG" --pattern "nanogig-$TAG-web.zip" --dir zips --clobber 2>/dev/null; then
              mkdir -p "dist/$TAG"
              unzip -qo "zips/nanogig-$TAG-web.zip" -d "dist/$TAG"
              echo "added $TAG"
            else
              echo "no web zip on $TAG, skipped"
            fi
          done
          ls -d dist/v* || true
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
