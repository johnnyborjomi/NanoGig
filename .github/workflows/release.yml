# Release: push a tag `vX.Y.Z` (e.g. via `npm version minor && git push --follow-tags`)
# and this builds the web app, zips dist/ and publishes a GitHub Release with generated
# notes. Can also be run by hand from the Actions tab for an existing tag.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v0.2.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Version from the tag
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          V="${TAG#v}"
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$ ]] || { echo "Tag '$TAG' is not vX.Y.Z"; exit 1; }
          # The build reads package.json, so a release cut from the GitHub UI still reports its tag.
          npm version "$V" --no-git-tag-version --allow-same-version
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Zip the web build
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          (cd dist && zip -qr "../nanogig-$TAG-web.zip" .)
          sha256sum "nanogig-$TAG-web.zip" > "SHA256SUMS-$TAG.txt"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: NanoGig ${{ env.TAG }}
          generate_release_notes: true
          files: |
            nanogig-${{ env.TAG }}-web.zip
            SHA256SUMS-${{ env.TAG }}.txt
